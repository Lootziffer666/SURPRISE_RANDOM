name: Prepare and screenshot random prototype

on:
  push:
    paths:
      - '.github/workflows/prepare-and-screenshot.yml'

permissions:
  contents: write

jobs:
  test-and-screenshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and unpack one-shot archive
        shell: bash
        run: |
          set -euo pipefail
          test -f 1379fcdb.zip
          unzip -t 1379fcdb.zip
          unzip -q -o 1379fcdb.zip -d .
          APP_PACKAGE="$(find . -mindepth 1 -maxdepth 6 -type f -name package.json -not -path '*/node_modules/*' | head -n1)"
          test -n "$APP_PACKAGE"
          APP_DIR="$(dirname "$APP_PACKAGE")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "App directory: $APP_DIR"

      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm install --no-audit --no-fund --package-lock=false
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            npm run build
          fi
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start prototype
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.preview ? 0 : 1)"; then
            nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/surprise-preview.log 2>&1 &
          elif node -e "const p=require('./package.json'); process.exit(p.scripts?.dev ? 0 : 1)"; then
            nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/surprise-preview.log 2>&1 &
          else
            nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/surprise-preview.log 2>&1 &
          fi
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/surprise-preview.log
          exit 1

      - name: Runtime test and screenshots
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const out = path.join(process.env.GITHUB_WORKSPACE, 'docs', 'screenshots');
          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(out, { recursive: true });
          const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'] });
          const page = await browser.newPage({ viewport: { width: 1365, height: 768 } });
          const errors = [];
          const warnings = [];
          page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
          page.on('console', msg => {
            if (msg.type() === 'error') errors.push(`console: ${msg.text()}`);
            if (msg.type() === 'warning') warnings.push(msg.text());
          });

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(1800);
          const visible = await page.locator('body').evaluate(el => {
            const r = el.getBoundingClientRect();
            return r.width > 100 && r.height > 100 && (el.innerText.trim().length > 0 || el.querySelector('canvas,svg,img,video'));
          });
          if (!visible) throw new Error('Prototype rendered no visible content');
          const canvasCount = await page.locator('canvas').count();
          let canvas = null;
          if (canvasCount > 0) {
            const box = await page.locator('canvas').first().boundingBox();
            const webgl = await page.evaluate(() => {
              const c = document.querySelector('canvas');
              if (!c) return null;
              try { return Boolean(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; }
            });
            canvas = box ? { width: box.width, height: box.height, webgl } : { width: 0, height: 0, webgl };
          }

          await page.screenshot({ path: path.join(out, '01-start.png'), fullPage: true });
          await page.keyboard.down('w');
          await page.waitForTimeout(900);
          await page.keyboard.up('w');
          await page.keyboard.press('ArrowUp');
          await page.waitForTimeout(500);
          await page.screenshot({ path: path.join(out, '02-after-keyboard-input.png'), fullPage: true });

          if (canvasCount > 0) {
            const box = await page.locator('canvas').first().boundingBox();
            if (box) await page.mouse.click(box.x + box.width * 0.65, box.y + box.height * 0.60);
          } else {
            await page.mouse.click(880, 460);
          }
          await page.waitForTimeout(1200);
          await page.screenshot({ path: path.join(out, '03-after-click.png'), fullPage: true });

          fs.writeFileSync(path.join(out, 'test-report.json'), JSON.stringify({
            testedAt: new Date().toISOString(),
            url: page.url(),
            title: await page.title(),
            canvasCount,
            canvas,
            interactions: ['W key', 'ArrowUp key', 'click'],
            consoleErrors: errors,
            consoleWarnings: warnings,
            status: errors.length ? 'rendered-with-runtime-errors' : 'rendered-without-runtime-errors'
          }, null, 2) + '\n');
          await browser.close();
          NODE

      - name: Commit unpacked source and screenshots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$APP_DIR/node_modules" "$APP_DIR/dist"
          git add -A -- .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No source or screenshot changes to commit.' >&2
            exit 1
          fi
          git commit -m 'Unpack and test random one-shot prototype'
          git push
